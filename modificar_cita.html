<body>
    <header>
        <h1>Modificar Cita Odontológica</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
            <li><a href="agendar_cita.html"><i class="fas fa-calendar-plus"></i> Agendar Cita</a></li>
            <li><a href="modificar_cita.html"><i class="fas fa-edit"></i> Modificar Cita</a></li>
            <li><a href="cancelar_cita.html"><i class="fas fa-calendar-times"></i> Cancelar Cita</a></li>

        </ul>
    </nav>
    <main>
        <section id="modificar-cita">
            <h2>Modificar Cita Existente</h2>
            <form action="php/modificar_cita.php" method="POST">
                <label for="id">ID de la Cita:</label>
                <input type="number" id="id" name="id" required>

                <label for="nombre">Nombre del Paciente:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora" required>

                <label for="motivo">Motivo de la Cita:</label>
                <textarea id="motivo" name="motivo" rows="4" required></textarea>

                <button type="submit">Modificar Cita</button>
            </form>
        </section>
    </main>
